                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Archive (draft/in_review/published -> archived, admin only)
      description: >
        Withdraws an item from any active status into archived. Archived items
        can be re-edited (PUT) which returns them to draft. Writes audit event
        admin.content.archive. editor receives 403.
      operationId: adminArchiveContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Publish directly from draft (draft -> published, admin only)
      description: >
        Approved change (design contract 3.4d): skips the review step for
        trusted content. Only valid from draft (409 otherwise). Requires the
        optimistic lock via the optional expectedVersion body field (409 on
        mismatch). Behaves like approve otherwise: sets publishedAt, writes a
        revision snapshot (action=publish), the item becomes visible in C-end
        /content/list (AC-10), and writes audit event admin.content.publish.
      operationId: adminPublishContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  description: Optimistic lock; 409 when it does not match current version
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/withdraw:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Withdraw from review (in_review -> draft, editor+)
      description: >
        Approved change (design contract 3.4d): the submitting editor (or any
        admin) pulls an item back from the review queue. Semantics is "recall
        pending review": the item returns to draft WITHOUT a new revision
        snapshot (editing will be re-submitted later, which snapshots again).
        reviewerId is cleared. Writes audit event admin.content.withdraw.
        Non-in_review items return 409.
      operationId: adminWithdrawContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Withdrawn to draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/duplicate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Duplicate an item as a new draft (editor+, source any status)
      description: >
        Approved change (design contract 3.4d): copies any item (any status)
        into a NEW content item with status=draft, version=1, publishedAt=null.
        The source item is never modified. The duplicate title defaults to
        "{source.title} (副本)" unless overridden in the body. Audit event
        admin.content.duplicate (targetId = new item, after.sourceId = source id).
      operationId: adminDuplicateContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 80, description: Override title of the duplicate }
      responses:
        '200':
          description: New draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/revisions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Revision history (newest first, snapshot excluded)
      operationId: adminListRevisions
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
