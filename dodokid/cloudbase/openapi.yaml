openapi: 3.0.3
info:
  title: DodoKid API
  description: >
    Backend API for DodoKid, a children's early-education app.
    Implements a dual-role model (verified parent <-> child profile created only
    after guardian consent), data minimization, and a unified response contract.

    v1.1.0 additions (Spec v0.2 section 5.2): a separate operations-console surface
    under /api/v1/admin/* protected by admin JWT (audience: admin) + RBAC roles
    (editor / admin). Rules locked by Spec section 14.5:

    - Admin auth is independent from parent auth: admin tokens carry audience
      "admin"; parent tokens carry audience "app". A parent token can never
      access /admin/* endpoints and vice versa.
    - All /admin/* endpoints (except login) require adminBearerAuth + RBAC.
    - Admin endpoints never return child-identifiable information; stats are aggregated.
    - Media upload: POST /admin/media issues temporary cloud-storage credentials
      scoped to a single object path; the admin frontend uploads the file directly
      to storage; the backend only persists media metadata (media_assets).

    Unified response envelope: { success, code, message, data }.
    code = 0 means success; non-zero error codes: 40000 validation, 40100 unauthorized,
    40300 forbidden (RBAC), 40400 not found, 40900 conflict (state/version), 42900 rate limited.

    v1.2.1 additions (P2-2 fix, sample chapters configurable): content_items
    gains an "isSample" boolean (default false, admin-only writable - editors
    submitting it receive 40300); a new C-end endpoint GET /content/samples
    returns up to 10 published sample chapters filtered by ageGroup.

    v1.2.0 additions (design contract 3.4d, approved): /admin/contents/{id}/publish
    (draft -> published, admin only), /admin/contents/{id}/withdraw
    (in_review -> draft, editor+, no revision snapshot), /admin/contents/{id}/duplicate
    (copy as new draft, editor+).
  version: 1.2.1
servers:
  - url: https://{env}.api.tcb-api.com/api/v1
    description: CloudBase HTTP cloud function (production)
    variables:
      env:
        default: dodokid-env
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
paths:
  # ------------------------------------------------------------------ Parent (C-end)
  /parent/sendSmsCode:
    post:
      summary: Send an SMS verification code
      operationId: sendSmsCode
      tags: [Parent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "13800138000"
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /parent/verifyCode:
    post:
      summary: Verify an SMS code (standalone check)
      operationId: verifyCode
      tags: [Parent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/Error'
  /parent/register:
    post:
      summary: Register a parent with phone + SMS code
      operationId: register
      tags: [Parent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/PublicUser' }
                          tokens: { $ref: '#/components/schemas/AuthTokens' }
        '409':
          $ref: '#/components/responses/Error'
  /parent/login:
    post:
      summary: Login a parent with phone + SMS code
      operationId: login
      tags: [Parent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/PublicUser' }
                          tokens: { $ref: '#/components/schemas/AuthTokens' }
        '409':
          $ref: '#/components/responses/Error'
  /parent/logout:
    post:
      summary: Revoke the current access token
      operationId: logout
      tags: [Parent]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /parent/gate/setup:
    post:
      summary: Set up the parent gate (password or biometric attestation)
      operationId: gateSetup
      tags: [Parent, Gate]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, secret]
              properties:
                type:
                  type: string
                  enum: [password, biometric]
                secret:
                  type: string
                  minLength: 4
      responses:
        '200':
          description: Gate configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /parent/gate/verify:
    post:
      summary: Verify the parent gate to obtain a short-lived gate token
      operationId: gateVerify
      tags: [Parent, Gate]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                type:
                  type: string
                  enum: [password, biometric]
                secret: { type: string }
      responses:
        '200':
          description: Verified, returns gate token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          gateToken: { type: string }
                          expiresInSec: { type: integer }
        '403':
          $ref: '#/components/responses/Error'
  /parent/settings:
    get:
      summary: Get parental settings (requires parent gate)
      operationId: getSettings
      tags: [Parent, Settings]
      security:
        - bearerAuth: []
        - gateToken: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ParentalSettings' }
        '403':
          $ref: '#/components/responses/Error'
  /parent/settings/timeLimit:
    put:
      summary: Update daily screen-time limit and mode (requires parent gate)
      operationId: setTimeLimit
      tags: [Parent, Settings]
      security:
        - bearerAuth: []
        - gateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyLimitMin]
              properties:
                dailyLimitMin:
                  type: integer
                  minimum: 0
                  maximum: 1440
                mode:
                  type: string
                  enum: [strict, balanced, free]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ParentalSettings' }
        '403':
          $ref: '#/components/responses/Error'
  /child/create:
    post:
      summary: Create a child profile (requires a prior consent record)
      operationId: createChild
      tags: [Child]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consentId, name, ageGroup]
              properties:
                consentId: { type: string }
                name: { type: string, maxLength: 40 }
                ageGroup:
                  type: string
                  enum: ['3-4', '4-6']
                avatar: { type: string, nullable: true }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChildProfile' }
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /child/switch:
    post:
      summary: Switch the active child profile (client selection)
      operationId: switchChild
      tags: [Child]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId]
              properties:
                childId: { type: string }
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChildProfile' }
  /child/list:
    get:
      summary: List child profiles for the current parent
      operationId: listChildren
      tags: [Child]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ChildProfile' }
  /child/{id}:
    get:
      summary: Get a single child profile
      operationId: getChild
      tags: [Child]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChildProfile' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Update a child profile (name/avatar/ageGroup only)
      operationId: updateChild
      tags: [Child]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 40 }
                avatar: { type: string, nullable: true }
                ageGroup:
                  type: string
                  enum: ['3-4', '4-6']
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChildProfile' }
    delete:
      summary: Delete a child profile and all related data (consent revocation)
      operationId: deleteChild
      tags: [Child]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: revoke
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          $ref: '#/components/responses/Error'
  /content/list:
    get:
      summary: List content items, routed by moduleKey and ageGroup (published only)
      description: >
        Returns only items with status=published (Spec AC-13 / AC-15). Items that
        are draft, in_review or archived are never visible here.
      operationId: listContent
      tags: [Content]
      security:
        - bearerAuth: []
      parameters:
        - name: moduleKey
          in: query
          required: false
          schema: { type: string }
        - name: ageGroup
          in: query
          required: false
          schema:
            type: string
            enum: ['3-4', '4-6']
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContentItem' }
  /content/samples:
    get:
      summary: List sample chapters (published AND isSample, up to 10)
      description: >
        v1.2.1: replaces the hardcoded sample ids in the child app home screen.
        Returns items with status=published AND isSample=true, ordered by order
        ascending, limited to 10. ageGroup accepts one value or a comma-separated
        list (OR semantics); when omitted, samples from all age groups are
        returned. isSample can only be set via the admin API by admins.
      operationId: listSampleContent
      tags: [Content]
      security:
        - bearerAuth: []
      parameters:
        - name: ageGroup
          in: query
          required: false
          description: Single value or comma-separated list, e.g. "3-4,4-6"
          schema: { type: string }
      responses:
        '200':
          description: Sample items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            maxItems: 10
                            items: { $ref: '#/components/schemas/ContentItem' }
  /content/search:
    get:
      summary: Search content items by title (published only)
      operationId: searchContent
      tags: [Content]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContentItem' }
  /content/categories:
    get:
      summary: List content modules (categories)
      description: Returns only enabled modules with iconKey/order for app rendering.
      operationId: listCategories
      tags: [Content]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Modules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ContentModule' }
  /content/{id}:
    get:
      summary: Get a content item with its media assets
      operationId: getContentItem
      tags: [Content]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Item + media
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item: { $ref: '#/components/schemas/ContentItem' }
                          media:
                            type: array
                            items: { $ref: '#/components/schemas/MediaAsset' }
        '404':
          $ref: '#/components/responses/Error'
  /content/{id}/mediaUrl:
    get:
      summary: Get a signed/temporary CDN URL for a media asset
      operationId: getMediaUrl
      tags: [Content]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mediaAssetId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
                          expiresAt: { type: string, nullable: true }
        '404':
          $ref: '#/components/responses/Error'
  /progress/{childId}:
    get:
      summary: Get progress summary for a child
      operationId: getProgress
      tags: [Progress]
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProgressSummary' }
        '403':
          $ref: '#/components/responses/Error'
    put:
      summary: Upsert a progress record for a child
      operationId: upsertProgress
      tags: [Progress]
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, status]
              properties:
                itemId: { type: string }
                status:
                  type: string
                  enum: [not_started, in_progress, completed]
                score:
                  type: number
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProgressRecord' }
  /progress/{childId}/list:
    get:
      summary: List all progress records for a child
      operationId: listProgress
      tags: [Progress]
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProgressRecord' }
  /milestones/{childId}:
    get:
      summary: List earned milestones for a child
      operationId: listMilestones
      tags: [Milestones]
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Milestones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Milestone' }
  /consent/record:
    post:
      summary: Record a guardian consent
      operationId: recordConsent
      tags: [Consent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, method]
              properties:
                childId: { type: string, nullable: true }
                type: { type: string }
                method: { type: string }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          consentId: { type: string }
                          status: { type: string }
  /preferences:
    put:
      summary: Update user preferences
      operationId: updatePreferences
      tags: [Preferences]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lang:
                  type: string
                  enum: ['zh-CN', 'en', 'zh-TW']
                theme:
                  type: string
                  enum: [light, dark, system]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Preferences' }
  /feedback:
    post:
      summary: Submit user feedback
      operationId: submitFeedback
      tags: [Feedback]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /version:
    get:
      summary: Get the app/build version
      operationId: getVersion
      tags: [Meta]
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VersionInfo' }
  /privacyPolicy:
    get:
      summary: Get the privacy policy reference
      operationId: getPrivacyPolicy
      tags: [Meta]
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrivacyPolicy' }

  # ------------------------------------------------------------------ Admin (operations console)
  /admin/auth/login:
    post:
      summary: Admin console login (account + password)
      description: >
        Independent from parent login (Spec 14.5). Issues a JWT with audience
        "admin". Requires role in {editor, admin} and status=active.
        Writes audit event admin.auth.login.
      operationId: adminLogin
      tags: [AdminAuth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account:
                  type: string
                  description: Phone number of the ops user
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/AdminUser' }
                          tokens: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /admin/auth/logout:
    post:
      summary: Revoke the current admin access token
      operationId: adminLogout
      tags: [AdminAuth]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /admin/auth/me:
    get:
      summary: Current ops identity and permission level
      operationId: adminMe
      tags: [AdminAuth]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '401':
          $ref: '#/components/responses/Error'
  /admin/stats:
    get:
      summary: Dashboard overview (aggregated, no child-identifiable data)
      operationId: adminStats
      tags: [AdminStats]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminStats' }
        '401':
          $ref: '#/components/responses/Error'
  /admin/contents:
    get:
      summary: List content items (admin view, all statuses)
      operationId: adminListContents
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      parameters:
        - { name: moduleKey, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [book, song, habit] } }
        - { name: ageGroup, in: query, required: false, schema: { type: string, enum: ['3-4', '4-6'] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, in_review, published, archived] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Title keyword }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [updatedAt, createdAt, title, order], default: updatedAt } }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Paged content list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminContent' }
                          meta: { $ref: '#/components/schemas/PageMeta' }
        '401':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a content item (enters status=draft)
      operationId: adminCreateContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentCreate' }
      responses:
        '200':
          description: Created draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a content item with attached media
      operationId: adminGetContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Item + media
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item: { $ref: '#/components/schemas/AdminContent' }
                          media:
                            type: array
                            items: { $ref: '#/components/schemas/AdminMediaAsset' }
        '404':
          $ref: '#/components/responses/Error'
    put:
      summary: Update a content item (optimistic locking)
      description: >
        Requires expectedVersion (conflict -> 409). Editing an item whose status
        is archived transitions it back to draft (re-edit, Spec 14.2). Items in
        status in_review are read-only here (409) until rejected or archived.
        Writes audit event admin.content.update.
      operationId: adminUpdateContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a content item (admin only)
      description: Hard delete; writes audit event admin.content.delete. editor receives 403 (AC-11).
      operationId: adminDeleteContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Submit for review (draft -> in_review)
      description: >
        Allowed from draft. Writes a content_revisions snapshot (AC-09) and
        audit event admin.content.submit. Any editor+ may submit their own
        or any draft.
      operationId: adminSubmitContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Approve and publish (in_review -> published, admin only)
      description: >
        Sets publishedAt, writes a published revision snapshot and audit event
        admin.content.approve. After this the item appears in C-end
        /content/list (AC-10). editor receives 403.
      operationId: adminApproveContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Reject review (in_review -> draft, admin only)
      description: Requires a reason; the reason is stored on the revision and audit event admin.content.reject.
      operationId: adminRejectContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Rejected back to draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminContent' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/unpublish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Take down (published -> archived, admin only)
      description: >
        Immediately hides the item from C-end /content/list (AC-13). Writes
        audit event admin.content.unpublish. editor receives 403.
      operationId: adminUnpublishContent
      tags: [AdminContent]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Unpublished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
