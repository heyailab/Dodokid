  /admin/media:
    get:
      summary: List media assets
      operationId: adminListMedia
      tags: [AdminMedia]
      security:
        - adminBearerAuth: []
      parameters:
        - { name: folder, in: query, required: false, schema: { type: string } }
        - { name: itemId, in: query, required: false, schema: { type: string } }
        - { name: mime, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paged media list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminMediaAsset' }
                          meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      summary: Issue direct-upload credentials and persist media metadata
      description: >
        One call does both halves of the upload flow (Spec 14.5 "temporary
        cloud-storage credentials, frontend direct upload, backend only stores
        metadata"): validates the declared metadata, creates the media_assets
        record, and returns temporary COS/CloudBase storage credentials scoped
        to a single object path (cdnKey). The admin frontend uploads the file
        directly with those credentials. If the upload is aborted, the record
        can be cleaned up via DELETE /admin/media/{id}. Writes audit event
        admin.media.upload.
      operationId: adminUploadMedia
      tags: [AdminMedia]
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '200':
          description: Credentials + persisted metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaUploadResult' }
