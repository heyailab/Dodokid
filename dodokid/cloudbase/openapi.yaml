        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ContentRevision' }
                          meta: { $ref: '#/components/schemas/PageMeta' }
        '404':
          $ref: '#/components/responses/Error'
  /admin/contents/{id}/restore/{revisionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: revisionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Roll back to a revision (admin only)
      description: >
        Forward-only rollback: the snapshot of the target revision becomes the
        new working copy, version increments by 1, status becomes draft, and a
        new revision (action=restore) is written. History is never rewritten.
