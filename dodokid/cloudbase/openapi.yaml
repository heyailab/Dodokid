        - { name: status, in: query, required: false, schema: { type: string, enum: [active, disabled] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paged user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminUser' }
                          meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/role:
    put:
      summary: Change an operations user role (admin only)
      description: Only editor <-> admin transitions allowed. Audit event admin.user.role_change with before/after.
      operationId: adminChangeUserRole
      tags: [AdminUser]
      security:
        - adminBearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [editor, admin]
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/status:
    put:
      summary: Enable or disable an operations user (admin only)
      description: A disabled user's tokens stop passing adminAuth immediately. Audit event admin.user.status_change.
      operationId: adminChangeUserStatus
      tags: [AdminUser]
      security:
        - adminBearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/audit:
    get:
      summary: Query audit log (admin only)
      operationId: adminListAudit
      tags: [AdminAudit]
      security:
        - adminBearerAuth: []
      parameters:
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string }, description: e.g. admin.content.approve }
        - { name: targetType, in: query, required: false, schema: { type: string } }
        - { name: targetId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paged audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditEntry' }
                          meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          $ref: '#/components/responses/Error'
  /admin/settings:
    get:
      summary: Get console settings (admin only)
      operationId: adminGetSettings
      tags: [AdminSettings]
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSettings' }
        '403':
          $ref: '#/components/responses/Error'
    put:
      summary: Update console settings (admin only)
      operationId: adminUpdateSettings
      tags: [AdminSettings]
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettings' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSettings' }
        '403':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Parent/child-app token, JWT audience "app".
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Operations-console token, JWT audience "admin". Verified by the
        adminAuth middleware: audience must be "admin", role must be editor
        or admin, user status must be active. Independent from bearerAuth
        (ADR-005).
    gateToken:
      type: apiKey
      in: header
      name: X-Gate-Token
  responses:
    Error:
      description: Unified error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: {}
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        code:
          type: integer
          description: |
            40000 validation | 40100 unauthorized | 40300 forbidden (RBAC) |
            40400 not found | 40900 conflict (state machine / version) | 42900 rate limited
          example: 40100
        message: { type: string, example: Unauthorized }
        data: { nullable: true }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    PublicUser:
      type: object
      properties:
        id: { type: string }
        phone: { type: string, example: "138****8000" }
        role: { type: string, example: parent }
        createdAt: { type: string, format: date-time }
    ChildProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ageGroup:
          type: string
          enum: ['3-4', '4-6']
        avatar: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ContentModule:
      type: object
      properties:
        _id: { type: string }
        key: { type: string }
        name: { type: string }
        colorToken: { type: string }
        iconKey: { type: string, description: Phosphor icon name, e.g. BookOpen }
        order: { type: integer }
        enabled: { type: boolean }
    ContentItem:
      type: object
      properties:
        _id: { type: string }
        moduleKey: { type: string }
        ageGroup:
          type: string
          enum: ['3-4', '4-6']
        title: { type: string }
        summary: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        mediaRef: { type: string }
        type: { type: string, enum: [book, song, habit] }
        tags:
          type: array
          items: { type: string }
        order: { type: integer }
        locale: { type: string, example: zh-CN }
    MediaAsset:
      type: object
      properties:
        _id: { type: string }
        itemId: { type: string, nullable: true }
        url: { type: string }
        cdnKey: { type: string }
        size: { type: integer }
        mime: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
    ProgressRecord:
      type: object
      properties:
        _id: { type: string }
        childId: { type: string }
        itemId: { type: string }
        status:
          type: string
          enum: [not_started, in_progress, completed]
        score: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }
    ProgressSummary:
      type: object
      properties:
        childId: { type: string }
        total: { type: integer }
        completed: { type: integer }
        inProgress: { type: integer }
        notStarted: { type: integer }
        completionRate: { type: integer }
    Milestone:
      type: object
      properties:
        _id: { type: string }
        childId: { type: string }
        badgeKey: { type: string }
        earnedAt: { type: string, format: date-time }
        streak: { type: integer }
    ParentalSettings:
      type: object
      properties:
        dailyLimitMin: { type: integer }
        mode:
          type: string
          enum: [strict, balanced, free]
    Preferences:
      type: object
      properties:
        lang:
          type: string
          enum: ['zh-CN', 'en', 'zh-TW']
        theme:
          type: string
          enum: [light, dark, system]
    VersionInfo:
      type: object
      properties:
        version: { type: string }
        minVersion: { type: string }
        updateRequired: { type: boolean }
    PrivacyPolicy:
      type: object
      properties:
        url: { type: string }
        text: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    # ---------------- Admin schemas ----------------
    AdminUser:
      type: object
      properties:
        id: { type: string }
        phone: { type: string, example: "138****8000", description: Masked }
        role:
          type: string
          enum: [parent, editor, admin]
        status:
          type: string
          enum: [active, disabled]
        createdAt: { type: string, format: date-time }
    AdminStats:
      type: object
      properties:
        contentTotal: { type: integer }
        byStatus:
          type: object
          properties:
            draft: { type: integer }
            in_review: { type: integer }
            published: { type: integer }
            archived: { type: integer }
        pendingReview:
          type: integer
          description: Alias of byStatus.in_review for the review queue card
        mediaTotal: { type: integer }
        recentAudit:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AuditEntry' }
    AdminContent:
      type: object
      properties:
        _id: { type: string }
        moduleKey: { type: string }
        type:
          type: string
          enum: [book, song, habit]
        ageGroup:
          type: string
          enum: ['3-4', '4-6']
        title: { type: string }
        summary: { type: string, nullable: true }
        cover: { type: string, nullable: true, description: cdnKey of the cover image }
        mediaRef: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        order: { type: integer }
        locale: { type: string, example: zh-CN }
        isSample:
          type: boolean
          default: false
          description: >
            v1.2.1: marks a trial-read sample chapter shown on the child app
            home screen. Admin-only writable (editor submissions return 40300).
        status:
          type: string
          enum: [draft, in_review, published, archived]
        version: { type: integer, description: Optimistic-lock counter, increments on every mutation }
        authorId: { type: string }
        reviewerId: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContentCreate:
      type: object
      required: [moduleKey, type, ageGroup, title]
      properties:
        moduleKey: { type: string }
        type: { type: string, enum: [book, song, habit] }
        ageGroup: { type: string, enum: ['3-4', '4-6'] }
        title: { type: string, maxLength: 80 }
        summary: { type: string, maxLength: 300 }
        cover: { type: string, description: cdnKey from media upload }
        mediaRef: { type: string }
        tags:
          type: array
          items: { type: string }
        order: { type: integer }
        locale: { type: string, default: zh-CN }
        isSample:
          type: boolean
          description: >
            v1.2.1, optional, admin-only: editors submitting this field receive
            40300; admins may mark the new item as a sample chapter.
    ContentUpdate:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          description: Optimistic lock; 409 when it does not match current version
        title: { type: string, maxLength: 80 }
        summary: { type: string, maxLength: 300 }
        cover: { type: string, nullable: true }
        mediaRef: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        order: { type: integer }
        locale: { type: string }
        isSample:
          type: boolean
          description: >
            v1.2.1, optional, admin-only: editors submitting this field receive
            40300; admins may toggle the sample-chapter flag.
    ContentRevision:
      type: object
      properties:
        _id: { type: string }
        contentId: { type: string }
        version: { type: integer }
        action:
          type: string
          enum: [submit, approve, publish, reject, restore]
        note: { type: string, nullable: true }
        authorId: { type: string }
        createdAt: { type: string, format: date-time }
    AdminModule:
      type: object
      properties:
        _id: { type: string }
        key: { type: string }
        name: { type: string }
        colorToken: { type: string, description: Design-token reference, never a raw hex in business data }
        iconKey: { type: string, description: Phosphor icon name, e.g. BookOpen }
        order: { type: integer }
        enabled: { type: boolean }
    ModuleUpsert:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, maxLength: 40 }
        colorToken: { type: string }
        iconKey: { type: string, description: Must be a Phosphor icon name; emoji forbidden }
        order: { type: integer }
        enabled: { type: boolean }
    ContentCategory:
      type: object
      properties:
        _id: { type: string }
        key: { type: string }
        name: { type: string }
        order: { type: integer }
        enabled: { type: boolean }
    CategoryUpsert:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, maxLength: 40 }
        order: { type: integer }
        enabled: { type: boolean }
    AdminMediaAsset:
      type: object
      properties:
        _id: { type: string }
        itemId: { type: string, nullable: true, description: Content item this asset is bound to, if any }
        folder: { type: string, example: books }
        fileName: { type: string }
        mime: { type: string }
        size: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        cdnKey: { type: string }
        url: { type: string, description: Public CDN URL }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }
    MediaUploadRequest:
      type: object
      required: [folder, fileName, mime, size]
      properties:
        folder:
          type: string
          enum: [books, songs, covers, icons, misc]
        fileName: { type: string, maxLength: 200 }
        mime:
          type: string
          description: Must be in AdminSettings.allowedMimeTypes (40000 otherwise)
        size:
          type: integer
          description: Must not exceed AdminSettings.mediaMaxSizeMB (40000 otherwise)
        itemId: { type: string, nullable: true, description: Bind to a content item at upload time }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true, description: For audio (song narration) }
    MediaUploadResult:
      type: object
      properties:
        mediaId: { type: string, description: media_assets record id }
        cdnKey:
          type: string
          description: >
            Deterministic object path "admin-media/{folder}/{yyyymm}/{uuid}-{fileName}";
            use it as cover/mediaRef on content items.
        cdnUrl: { type: string, description: Public CDN URL once upload completes }
        upload:
          type: object
          description: Temporary cloud-storage credentials scoped to cdnKey only
          properties:
            tmpSecretId: { type: string }
            tmpSecretKey: { type: string }
            sessionToken: { type: string }
            storagePath: { type: string }
            expiresInSec: { type: integer, example: 1800 }
            maxFileSize: { type: integer, description: Server-enforced byte limit }
    AuditEntry:
      type: object
      properties:
        _id: { type: string }
        actor: { type: string, description: users._id of the operator }
        actorRole: { type: string, enum: [editor, admin] }
        action: { type: string, example: admin.content.approve }
        targetType: { type: string, example: content_item }
        targetId: { type: string }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        ip: { type: string, nullable: true }
        ts: { type: string, format: date-time }
    AdminSettings:
      type: object
      properties:
        mediaMaxSizeMB:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        allowedMimeTypes:
          type: array
          items: { type: string }
          example: ["image/png", "image/jpeg", "image/webp", "audio/mpeg", "audio/mp4"]
        defaultLocale:
          type: string
          default: zh-CN
        paginationLimit:
          type: integer
          minimum: 10
          maximum: 100
          default: 20
