# DodoKid 后端 MongoDB 配置片段（合并进 /etc/mongod.conf）
#
# 为什么必须改：直接部署在公网服务器上时，MongoDB 默认虽已绑 127.0.0.1，
# 但**未开启鉴权**。一旦有人把 bindIp 改成 0.0.0.0（或云厂商的内网地址被误用），
# 数据库将完全裸奔——里面是家长账号、儿童档案与阅读记录。
#
# 应用方式（Debian/Ubuntu 与 RHEL/Rocky 相同）：
#   sudo cp /etc/mongod.conf /etc/mongod.conf.bak
#   sudo vi /etc/mongod.conf      # 用下面两项覆盖同名项
#   sudo systemctl restart mongod
#
# 改完必须用带凭证的 URI 连接，否则会失败（这是预期行为，说明鉴权生效了）。

net:
  ip: 127.0.0.1          # 只监听回环，绝不监听 0.0.0.0
  port: 27017
  bindIp: 127.0.0.1

security:
  authorization: enabled  # 开启鉴权（无 authSource 的连接将被拒绝）

storage:
  dbPath: /var/lib/mongodb
