# DodoKid 站点配置（直接部署版）
#
# 安装：
#   sudo cp deploy/nginx/dodokid.conf /etc/nginx/sites-available/dodokid
#   sudo ln -s /etc/nginx/sites-available/dodokid /etc/nginx/sites-enabled/dodokid
#   # 首次申请证书前，先用一个只监听 80 的临时 server 块（见文件末尾说明）
#   sudo certbot --nginx -d dodokid.heymf.cn
#   sudo nginx -t && sudo systemctl reload nginx
#
# 后台静态文件部署位置：/var/www/dodokid-admin（由 dodokid-admin 构建产物拷贝而来）

server {
    listen 80;
    server_name dodokid.heymf.cn;
    # 首次跑 certbot 时保持这个 301 即可（certbot 会自动改写为证书配置）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dodokid.heymf.cn;

    # ssl_certificate / ssl_certificate_key 由 certbot 写入
    ssl_certificate     /etc/letsencrypt/live/dodokid.heymf.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dodokid.heymf.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 后台上传媒体走对象存储直传，这里只是给 JSON  bodies 留余量
    client_max_body_size 10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 运营后台（静态） ----
    root /var/www/dodokid-admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;      # SPA 路由回退
    }
    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # index.html 绝不缓存，否则前端发版后用户拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- API 反代到 Node 进程 ----
    # 注意：proxy_pass 后面**不要加路径后缀**。
    # 容器/进程内路由表注册的已是 /api/v1/... 完整路径，加后缀会导致全部 404。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 限流按客户端 IP 计数，这三个头必须透传，否则所有请求会被算到同一个 IP 上
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---- 本地媒体（服务器磁盘）----
    # MEDIA_ROOT 由 .env 的 MEDIA_ROOT 指定，这里必须与之一致。
    # 用 alias 而不是让 Node 转发：静态文件直出，不占 Node 进程，
    # 也不会因为 API 重启而短暂 502。
    # 路径末尾**不要加斜杠**（加了就变成 /media/xxx → 别名映射会错位）。
    location /media/ {
        alias /var/lib/dodokid/media/;
        # cdnKey 里带 uuid，内容变了就换名，可以长期强缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        # 禁止被当成脚本执行（万一上传了可执行内容）
        location ~* \.(php|py|sh|pl|cgi)$ { deny all; }
    }

    # 放行健康检查不记日志，避免刷屏
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
